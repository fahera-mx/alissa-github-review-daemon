name: Check Container Entrypoint Config Rendering
on: [pull_request]

# Two entrypoint contracts are checked here:
#   * the revloop.config.json renderer's pass-through-when-unset behaviour
#     (optional tuning keys omitted so the daemon library default applies;
#     structural keys pinned) — docker/claude/tests-entrypoint-config.sh;
#   * the reviewer-console wiring (ALISSA_UI_ENABLED / ALISSA_UI_PASSCODE /
#     ${PORT} / /healthz), by booting the real entrypoint against stubbed CLIs
#     with the real sidecar — docker/claude/tests-entrypoint-ui.sh;
#   * the reviewer-identity preflight (ALISSA_REVIEWER_TOKEN_ENV /
#     ALISSA_REVIEWER_LOGIN), likewise by booting the real entrypoint —
#     docker/claude/tests-entrypoint-identity.sh;
#   * the `alissa auth login` failure triage (missing CLI -> re-bootstrap,
#     unreachable API / unwritable config -> capped backoff, genuine 401 ->
#     fast FATAL), same way — docker/claude/tests-entrypoint-auth.sh;
#   * the bridge-executor role (CONTAINER_ROLE / ALISSA_BRIDGE_* gate, executor
#     identity, and the guarantee that neither role starts the other's
#     supervisor) — docker/claude/tests-entrypoint-executor.sh;
#   * the workspace-prune wiring (boot pass + supervised interval loop,
#     default-on with an opt-out, capability-gated, --force never passed) —
#     docker/claude/tests-entrypoint-prune.sh;
#   * the guarded boot-time chown (warm boot skips the volume walk, a root-owned
#     probe result or ALISSA_FORCE_CHOWN=1 still runs it) —
#     docker/claude/tests-entrypoint-chown.sh.
jobs:
  entrypoint-config-check:
    name: Entrypoint config renderer + console wiring
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Install daemon package (for the library-default cross-check)
        # Install the SAME PyPI release the image ships (REVLOOP_VERSION pinned
        # in the Dockerfile), not the repo source tree, so the cross-check
        # validates the library the container actually runs and would catch a
        # pin/default divergence (e.g. a README default that drifts from the pin).
        #
        # First-release bootstrap: the renamed dist alissa-tools-github-revloop
        # has no prior PyPI version to pin to — its first release (the version
        # this PR publishes on merge) is not on PyPI while the PR is open. So if
        # the pinned version is not yet published, fall back to the repo source
        # tree, which is byte-identical to what this PR will publish. Once the
        # release lands, the primary PyPI install succeeds and this never fires.
        run: |
          python -m pip install --upgrade pip
          version="$(grep -oP '^ARG REVLOOP_VERSION=\K[0-9.]+' docker/claude/Dockerfile)"
          echo "Installing alissa-tools-github-revloop==${version} (pinned in Dockerfile)"
          if ! python -m pip install "alissa-tools-github-revloop==${version}"; then
            echo "::warning::alissa-tools-github-revloop==${version} not on PyPI yet (first release of the renamed dist) — falling back to the repo source tree for the cross-check"
            python -m pip install ./alissa-tools-github-revloop
          fi
      - name: Execute Entrypoint Config Tests
        run: bash docker/claude/tests-entrypoint-config.sh
      - name: Execute Entrypoint Reviewer-Identity Tests
        # Boots the entrypoint four times against a `gh` stub that answers with
        # the login owning the token it was called with — so a call carrying the
        # inherited credential and one carrying the reviewer's token disagree,
        # which is the container condition behind issue #51.
        timeout-minutes: 3
        run: bash docker/claude/tests-entrypoint-identity.sh
      - name: Execute Entrypoint Auth-Triage Tests
        # Boots the entrypoint four times against a scriptable `curl` stub (the
        # API reachability probe AND the official installer) and an `alissa`
        # stub that can answer a login with a real 401. Three of the four
        # classes must SELF-HEAL with no restart, which is the contract issue
        # #62 exists for; only the genuine rejection may exit.
        timeout-minutes: 5
        run: bash docker/claude/tests-entrypoint-auth.sh
      - name: Execute Entrypoint Bridge-Executor Role Tests
        # Boots the entrypoint nine times across both roles. The load-bearing
        # assertions are negative: an unarmed executor starts nothing, an armed
        # one starts neither the worker nor alissa-revloop, and the daemon role
        # never starts a bridge however the ALISSA_BRIDGE_* env is set — the
        # two services must not share a process chain (issue #73). One case
        # holds a config dir unwritable to prove the volume class still backs
        # off instead of crash-looping, hence the timeout headroom.
        timeout-minutes: 6
        run: bash docker/claude/tests-entrypoint-executor.sh
      - name: Execute Entrypoint Guarded-Chown Tests
        # Boots the entrypoint six times through a FAKE root pass (`id -u`
        # answers 0 once, `gosu` execs in place) so the root-only step 0 is
        # exercised without root or docker. `chown`/`find` record instead of
        # running and `stat` answers scripted ownership, which is what makes
        # "the probe stayed O(top-level entries)" an assertion rather than a
        # claim; the last case runs against the real stat and the real tree.
        timeout-minutes: 4
        run: bash docker/claude/tests-entrypoint-chown.sh
      - name: Execute Entrypoint Workspace-Prune Tests
        # Boots the entrypoint six times against an `alissa` stub that records
        # every `code workspace prune` invocation with its argv AND its cwd —
        # which is what makes "--force is never passed" and "an old CLI runs
        # nothing" assertions rather than claims. The stub reproduces
        # commander's real behaviour for an unknown subcommand (parent help,
        # exit 0), so the capability probe is tested against the trap it exists
        # for. Two cases wait out several ticks of the test-only seconds
        # override, hence the headroom.
        timeout-minutes: 6
        run: bash docker/claude/tests-entrypoint-prune.sh
      - name: Execute Entrypoint Console Wiring Tests
        # Boots the entrypoint four times (console off / enabled-without-passcode
        # / enabled / sidecar killed under it). No docker needed: the CLIs the
        # entrypoint shells out to are stubbed and the console sidecar is the
        # real one installed above. The last case waits out two 30s monitor
        # windows, hence the timeout headroom.
        timeout-minutes: 5
        run: bash docker/claude/tests-entrypoint-ui.sh
